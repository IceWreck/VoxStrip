syntax = "proto3";

package voxstrip.v1;

option go_package = "github.com/IceWreck/VoxStrip/gen/proto;voxstripv1";

import "google/protobuf/timestamp.proto";

// RPC

service KaraokeService {
  rpc ImportSongs(ImportSongsRequest) returns (ImportSongsResponse);
  rpc ListSongs(ListSongsRequest) returns (ListSongsResponse);
  rpc GetSong(GetSongRequest) returns (GetSongResponse);
  rpc UpdateSong(UpdateSongRequest) returns (UpdateSongResponse);
  rpc GetCoverArt(GetCoverArtRequest) returns (GetCoverArtResponse);
  rpc DeleteSong(DeleteSongRequest) returns (DeleteSongResponse);
  rpc DownloadAudio(DownloadAudioRequest) returns (DownloadAudioResponse);
}

// Shared

message SongMetadata {
  string title = 1;
  string artist = 2;
  string album = 3;
  string album_artist = 4;
  string genre = 5;
  string lyrics = 6;
}

message Song {
  string song_id = 1;
  SongMetadata metadata = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
  ProcessingStatus processing_status = 5;
  string processing_error = 6;

  int64 duration_ms = 7;
}

enum ProcessingStatus {
  PROCESSING_STATUS_UNSPECIFIED = 0; // Default value
  PROCESSING_STATUS_PENDING = 1;     // Just uploaded
  PROCESSING_STATUS_PROCESSING = 2;  // Audio separation in progress
  PROCESSING_STATUS_COMPLETED = 3;   // Ready for use
  PROCESSING_STATUS_FAILED = 4;      // Processing error
}

enum AudioVersion {
  AUDIO_VERSION_UNSPECIFIED = 0;  // Default value
  AUDIO_VERSION_ORIGINAL = 1;     // Original uploaded file
  AUDIO_VERSION_VOCAL = 2;        // Vocals only
  AUDIO_VERSION_INSTRUMENTAL = 3; // Instrumental only
}

// Import

message ImportSongsRequest { repeated ImportSongRequest songs = 1; }

message ImportSongRequest {
  bytes audio = 1; // max 50MB per song

  // song metadata overrides (take precedence over music tags in the audio file)
  optional bytes cover_art_override = 2;
  optional string title_override = 3;
  optional string artist_override = 4;
  optional string album_override = 5;
  optional string album_artist_override = 6;
  optional string genre_override = 7;
  optional string lyrics_override = 8;
}

message ImportSongResult {
  string song_id = 1;
  ProcessingStatus status = 2;
  string error_message = 3; // empty if successful
}

message ImportSongsResponse { repeated ImportSongResult results = 1; }

// Library Management

message ListSongsRequest {
  int32 page_size = 1;
  string page_token = 2;
  optional ProcessingStatus status_filter = 3;
}

message ListSongsResponse {
  repeated Song songs = 1;
  string next_page_token = 2;
  int32 total_size = 3;
}

message GetSongRequest { string song_id = 1; }

message GetSongResponse { Song song = 1; }

// UpdateSongRequest updates song metadata. Only fields that are set are
// applied; unset fields keep their current value.
message UpdateSongRequest {
  string song_id = 1;
  optional string title = 2;
  optional string artist = 3;
  optional string album = 4;
  optional string album_artist = 5;
  optional string genre = 6;
  optional string lyrics = 7;
}

message UpdateSongResponse { Song song = 1; }

message DeleteSongRequest { string song_id = 1; }

message DeleteSongResponse {}

message GetCoverArtRequest { string song_id = 1; }

message GetCoverArtResponse {
  bytes image = 1;
  string filename = 2;
}

// Export / Download

message DownloadAudioRequest {
  string song_id = 1;
  AudioVersion version = 2;
}

message DownloadAudioResponse {
  bytes audio = 1;
  string filename = 2;
}
